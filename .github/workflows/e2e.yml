name: e2e

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHP_CLI_SERVER_WORKERS: '4'
      MAILPIT_URL: http://127.0.0.1:8025
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: uply
          POSTGRES_DB: uply
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uply -d uply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: pcntl, pdo_pgsql, pgsql, intl, sockets
          ini-values: date.timezone=UTC
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the API
        working-directory: api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env
          sed -i 's/^MONITORING_ALLOW_PRIVATE_TARGETS=.*/MONITORING_ALLOW_PRIVATE_TARGETS=true/' .env
          sed -i "s/^REVERB_APP_ID=.*/REVERB_APP_ID=e2e/" .env
          sed -i "s/^REVERB_APP_KEY=.*/REVERB_APP_KEY=$(openssl rand -hex 16)/" .env
          sed -i "s/^REVERB_APP_SECRET=.*/REVERB_APP_SECRET=$(openssl rand -hex 16)/" .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force
      - name: Install the web app
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the stack
        run: |
          mkdir -p logs
          (cd api && nohup php artisan serve --host=127.0.0.1 --port=8000 > ../logs/api.log 2>&1 &)
          (cd api && nohup php artisan reverb:start --host=127.0.0.1 --port=6001 > ../logs/reverb.log 2>&1 &)
          (cd api && nohup php artisan queue:work --queue=alerts,realtime,checks,default --sleep=1 > ../logs/worker.log 2>&1 &)
          (cd api && nohup php artisan schedule:work > ../logs/scheduler.log 2>&1 &)
          (cd web && nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > ../logs/web.log 2>&1 &)
      - name: Wait for the ports
        run: |
          for port in 8000 6001 5173 8025; do
            for attempt in $(seq 1 60); do
              if curl -s -o /dev/null "http://127.0.0.1:${port}"; then
                echo "port ${port} is up"
                break
              fi
              if [ "${attempt}" = 60 ]; then
                echo "port ${port} never answered"
                exit 1
              fi
              sleep 1
            done
          done
      - name: Run the end to end tests
        working-directory: web
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            logs
          retention-days: 7
